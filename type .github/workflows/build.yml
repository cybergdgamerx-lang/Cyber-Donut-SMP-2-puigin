name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q CDS2Core.zip
      - run: mvn -B -f CDS2Core/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: CDS2Core-jar
          path: CDS2Core/target/CDS2Core.jar
